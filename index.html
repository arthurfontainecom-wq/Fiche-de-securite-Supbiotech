<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche de sécurité Supbiotech</title>
    <link rel="stylesheet" href="style1.css">
    <meta name="robots" content="noindex, nofollow">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Fiche de sécurité Supbiotech</h1>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="container">
            <h2>Banque de fiche de sécurité numérique</h2>
            <p>⬇ Recherche ta fiche de sécurité ⬇</p>
</div>           
<section class="pdf-container">

    <!-- COLONNE GAUCHE : LYON (vide ou plus tard) -->
    <section class="pdf-section">
        <h3>Document PDF Lyon</h3>

        <form class="search-form">
            <input type="search" placeholder="Rechercher un PDF..." class="search-input">
        <ul id="pdfLyon" class="pdf-list">
        </ul> 
        </form>

        <p style="text-align:center; color:#6b7280;">
            Aucun document pour le moment
        </p>
    </section>

    <!-- COLONNE DROITE : VILLEJUIF (TOUS LES PDF ICI) -->
    <section class="pdf-section">
        <h3>Document PDF Villejuif</h3>

        <form class="search-form">
            <input type="search" placeholder="Rechercher un PDF..." class="search-input" id="searchVillejuif">
        <ul id="pdfVillejuif" class="pdf-list">
        </ul> 
</section>

    <script src="script.js"></script>
</body>
</html>
