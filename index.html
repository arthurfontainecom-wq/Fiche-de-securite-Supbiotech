<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche de sécurité Supbiotech</title>
    <link rel="stylesheet" href="style1.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <header class="header">
        <div class="container"><h1>Fiche de sécurité Supbiotech</h1></div>
    </header>

    <section class="pdf-container">
        <section class="pdf-section">
            <h3>Document PDF Lyon</h3>
            <input type="search" id="searchLyon" placeholder="Rechercher à Lyon..." class="search-input">
            <ul id="pdfLyon" class="pdf-list"></ul> 
        </section>

        <section class="pdf-section">
            <h3>Document PDF Villejuif</h3>
            <input type="search" id="searchVillejuif" placeholder="Rechercher à Villejuif..." class="search-input">
            <ul id="pdfVillejuif" class="pdf-list"></ul>
        </section>
    </section>

    <script src="script.js"></script>
</body>
</html>
