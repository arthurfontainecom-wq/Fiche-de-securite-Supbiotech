<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche de sécurité Supbiotech</title>
    <link rel="stylesheet" href="style1.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <header class="header">
        <div class="container"><h1 class="logo">Fiche de sécurité Supbiotech</h1></div>
    </header>

    <section class="hero">
        <div class="container">
            <h2>Banque de fiches de sécurité</h2>
            <input type="search" id="searchBar" placeholder="Rechercher une fiche..." class="search-input" style="width:100%; max-width:400px; margin-top:20px;">
        </div>
    </section>
   <section class="pdf-container">
    <ul id="pdfList" class="pdf-list">
        <li>Chargement des documents...</li>
    </ul>
    <!-- VIEWER PDF -->
    <div id="pdfViewer" style="margin-top:2rem; display:none;">
        <h3 id="pdfTitle"></h3>
        <iframe
            id="pdfFrame"
            style="width:100%; height:80vh; border:1px solid #ccc; border-radius:8px;">
        </iframe>
    </div>
</section>

    <script src="script.js"></script>
</body>
</html>
