backend:
  name: git-gateway
  branch: main

media_folder: "pdf"
public_folder: "/pdf"

collections:
  - name: "fiches_villejuif"
    label: "Fiches Villejuif"
    folder: "pdf/villejuif"
    create: true
    extension: pdf
    format: commit
    fields:
    - { label: "Fiche PDF", name: "file", widget: "file" }
    
      
  - name: "fiches_lyon"
    label: "Fiches Lyon"
    folder: "pdf/lyon"
    create: true
    extension: pdf
    format: commit
    fields:
     - { label: "Fiche PDF", name: "file", widget: "file" }
